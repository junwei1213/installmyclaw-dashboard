    :root {
      --bg: #070a12;
      --bg-card: #121826;
      --bg-card-2: #171f30;
      --border: rgba(255,255,255,.08);
      --border-2: rgba(255,255,255,.14);
      --text: #f3f6ff;
      --muted: #97a3bb;
      --dim: #6b778f;
      --accent: #8aa4ff;
      --ok: #3dd68c;
      --ok-soft: rgba(61,214,140,.14);
      --warn: #f5c14a;
      --warn-soft: rgba(245,193,74,.12);
      --ig: #E1306C;
      --fb: #1877F2;
      --yt: #FF0000;
      --th: #fff;
      --x: #fff;
      --radius: 18px;
      --shadow: 0 16px 50px rgba(0,0,0,.4);
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1000px 520px at 8% -8%, rgba(138,164,255,.22), transparent 55%),
        radial-gradient(800px 420px at 92% 0%, rgba(225,48,108,.12), transparent 50%),
        radial-gradient(700px 400px at 50% 100%, rgba(24,119,242,.08), transparent 50%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    .wrap { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 56px; }

    header.top {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px 24px;
      align-items: center; margin-bottom: 28px;
    }
    .brand { display: flex; gap: 14px; align-items: center; }
    .brand-avatar {
      width: 56px; height: 56px; border-radius: 16px; object-fit: cover;
      border: 1px solid var(--border-2); box-shadow: var(--shadow); background: #111;
    }
    .brand h1 { margin: 0; font-size: clamp(1.4rem, 2.5vw, 1.85rem); letter-spacing: -.02em; font-weight: 780; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
    .meta-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: 999px;
      background: rgba(18,24,38,.9); border: 1px solid var(--border); color: var(--muted); font-size: .875rem;
      backdrop-filter: blur(8px);
    }
    .meta-pill strong { color: var(--text); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }

    section { margin-bottom: 28px; }
    .section-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 12px; }
    .section-head h2 {
      margin: 0; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: 750;
    }

    .kpi-grid { display:grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 12px; }
    .kpi {
      background: linear-gradient(180deg, rgba(255,255,255,.03), transparent), var(--bg-card);
      border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px;
      box-shadow: var(--shadow); min-height: 112px; position: relative; overflow: hidden;
    }
    .kpi::after {
      content:""; position:absolute; right:-24px; bottom:-36px; width:110px; height:110px; border-radius:50%;
      background: rgba(138,164,255,.12); filter: blur(2px);
    }
    .kpi .label { color: var(--muted); font-size: .82rem; font-weight: 650; margin-bottom: 10px; }
    .kpi .value { font-size: clamp(1.55rem, 3vw, 2rem); font-weight: 780; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .kpi .hint { margin-top: 6px; color: var(--dim); font-size: .74rem; }

    .channel-grid { display:grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 12px; }
    .channel {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; transition: .15s ease; min-height: 148px;
    }
    .channel:hover { background: var(--bg-card-2); border-color: var(--border-2); transform: translateY(-1px); }
    .channel-top { display:flex; justify-content:space-between; align-items:center; gap: 8px; margin-bottom: 14px; }
    .plat {
      display:inline-flex; align-items:center; gap: 8px;
      padding: 6px 10px; border-radius: 999px; font-size: .78rem; font-weight: 750;
      border: 1px solid var(--border); background: rgba(255,255,255,.04);
    }
    .plat .ico, .chip .ico, .links a .ico {
      width: 16px; height: 16px; display:inline-grid; place-items:center; flex-shrink: 0;
    }
    .plat .ico svg, .chip .ico svg, .links a .ico svg { width: 16px; height: 16px; display:block; }
    .plat.instagram { background: rgba(225,48,108,.12); border-color: rgba(225,48,108,.35); color: #ffb1c9; }
    .plat.facebook { background: rgba(24,119,242,.12); border-color: rgba(24,119,242,.35); color: #9dc2ff; }
    .plat.youtube { background: rgba(255,0,0,.12); border-color: rgba(255,0,0,.35); color: #ff9aa3; }
    .plat.threads { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.2); color: #fff; }
    .plat.twitter, .plat.x { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.2); color: #fff; }
    .status {
      font-size: .7rem; font-weight: 750; letter-spacing: .04em; text-transform: uppercase;
      color: var(--ok); background: var(--ok-soft); border: 1px solid rgba(61,214,140,.25);
      padding: 4px 8px; border-radius: 999px;
    }
    .channel h3 { margin: 0 0 4px; font-size: 1rem; }
    .channel .handle { color: var(--muted); font-size: .86rem; margin-bottom: 10px; }
    .channel .page { color: var(--dim); font-size: .75rem; }

    .table-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; box-shadow: var(--shadow);

    table.posts { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    th {
      font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
      background: rgba(255,255,255,.02); font-weight: 750; white-space: nowrap;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,.02); }
    .date-cell { white-space: nowrap; color: var(--muted); font-size: .86rem; font-variant-numeric: tabular-nums; }
    .date-cell .time { display:block; color: var(--dim); font-size: .74rem; margin-top: 2px; }

    .title-cell .title { font-weight: 680; font-size: .94rem; margin-bottom: 8px; }
    .chips, .links { display:flex; flex-wrap:wrap; gap: 6px; }
    .chip {

      border: 1px solid var(--border); background: rgba(255,255,255,.04); color: var(--muted);
      text-transform: capitalize;

    .chip.instagram { color:#ffb1c9; border-color:rgba(225,48,108,.35); background:rgba(225,48,108,.1); }
    .chip.facebook { color:#9dc2ff; border-color:rgba(24,119,242,.35); background:rgba(24,119,242,.12); }
    .chip.youtube { color:#ff9aa3; border-color:rgba(255,0,0,.35); background:rgba(255,0,0,.1); }
    .chip.threads, .chip.twitter, .chip.x { color:#fff; border-color:rgba(255,255,255,.22); }
    .links a {
      display:inline-flex; align-items:center; gap: 6px;
      font-size: .72rem; color: var(--muted); background: rgba(255,255,255,.04);
      border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px;
    }
    .links a:hover { color: var(--text); border-color: var(--border-2); }
    .pub {
      display:inline-flex; align-items:center; gap: 6px; font-size: .78rem; font-weight: 680;
      color: var(--ok); background: var(--ok-soft); border: 1px solid rgba(61,214,140,.22);
      padding: 4px 9px; border-radius: 999px; white-space: nowrap;
    }
    .pub::before { content:""; width:6px; height:6px; border-radius:50%; background: currentColor; }
    .metrics { display:grid; grid-template-columns: repeat(4, minmax(52px,1fr)); gap: 8px; min-width: 240px; }
    .metric { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; text-align:center; }
    .metric .n { display:block; font-weight: 750; font-variant-numeric: tabular-nums; }
    .metric .l { display:block; color: var(--dim); font-size: .68rem; margin-top: 2px; }

    .notes {
      background: linear-gradient(135deg, var(--warn-soft), transparent 55%), var(--bg-card);
      border: 1px solid rgba(245,193,74,.28); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow);

    .notes h2 { margin: 0 0 10px; font-size: .95rem; color: var(--warn); text-transform: none; letter-spacing: 0; font-weight: 750; }
    .notes ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: .9rem; }
    .notes li { margin: 6px 0; }
    footer { margin-top: 10px; color: var(--dim); font-size: .78rem; display:flex; flex-wrap:wrap; gap: 8px 16px; justify-content: space-between; }
    .logo-row { display:flex; gap: 10px; align-items:center; color: var(--dim); }
    #foot-logos .mini { width: 18px; height: 18px; opacity: .9; display:inline-grid; }
    #foot-logos .mini svg { width: 18px; height: 18px; }

    @media (max-width: 980px) {
      .kpi-grid, .channel-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 560px) {
      .kpi-grid, .channel-grid { grid-template-columns: 1fr; }
      .wrap { width: calc(100% - 24px); }
    }
  </style>
</head>

        return `<article class="channel">
          <div class="channel-top">
            <span class="plat ${p}">${icon(p)}${label(p)}</span>
            <span class="status">${c.status||'active'}</span>
          </div>
          <h3>${c.name||''}</h3>
          <div class="handle">${handle}</div>
          ${c.page ? `<div class="page">Page · ${c.page}</div>` : ''}
        </article>`;
      }).join('');

      document.getElementById('posts').innerHTML = posts.map(p => {
        const t = fmtMYT(p.published_at);
        const plats = (p.platforms||[]).map(x => `<span class="chip ${x}">${icon(x)}${label(x)}</span>`).join('');
        const links = Object.entries(p.permalinks||{}).map(([k,u]) =>
          `<a href="${u}" target="_blank" rel="noopener">${icon(k)}${label(k)}</a>`
        ).join('');
        const m = p.metrics || {};
        return `<tr>
          <td class="date-cell">${t.date}<span class="time">${t.time} MYT</span></td>
          <td class="title-cell"><div class="title">${p.title||''}</div><div class="links">${links}</div></td>
          <td><div class="chips">${plats}</div></td>
          <td><span class="pub">已发布</span></td>
          <td><div class="metrics">
            <div class="metric"><span class="n">${n(m.views)}</span><span class="l">观看</span></div>
            <div class="metric"><span class="n">${n(m.likes)}</span><span class="l">点赞</span></div>
            <div class="metric"><span class="n">${n(m.comments)}</span><span class="l">评论</span></div>
            <div class="metric"><span class="n">${n(m.shares)}</span><span class="l">分享</span></div>
          </div></td>
        </tr>`;
      }).join('');

      document.getElementById('notes').innerHTML = (data.notes||[]).map(x=>`<li>${x}</li>`).join('');
      document.getElementById('foot-logos').innerHTML =
        ['instagram','facebook','youtube','threads','twitter'].map(p=>`<span class="mini">${ICONS[p]}</span>`).join('');
    }

    async function boot(){
      try {
        const res = await fetch('data.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('bad');
        render(await res.json());
      } catch (e) {
        render(FALLBACK_DATA);
      }
    }
    boot();
  </script>
</body>
</html>
